<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,sans-serif;background:#0F1117;color:#E5E7EB;min-height:100vh;padding-bottom:80px}
body.light{background:#f5f5f0;color:#282828}
.header{background:#1A1D2E;border-bottom:1px solid #2A2D3E;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
body.light .header{background:#fff;border-bottom:2px solid #C82828}
.logo{font-size:16px;font-weight:700;color:#fff}
body.light .logo{color:#282828}
.logo span{color:#C82828}
.header-right{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid #2A2D3E;background:#0F1117;color:#9CA3AF;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
body.light .icon-btn{border-color:rgba(0,0,0,0.15);background:#f0f0f0;color:#555}
.dot{width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;animation:pulse 2s infinite}
.dot.off{background:#EF4444;animation:none}
.dot.saving{background:#FBBF24;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px 16px}
.stat{background:#1A1D2E;border-radius:10px;padding:10px 14px}
body.light .stat{background:#fff;border:1px solid rgba(0,0,0,0.08)}
.stat .label{font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.stat .value{font-size:22px;font-weight:700}
.stat.blue .value{color:#C82828}
.stat.ok .value{color:#34D399}
.stat.danger .value{color:#F87171}
.stat.warn .value{color:#FBBF24}
.filter-section{padding:0 16px 12px}
.search-box{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #2A2D3E;background:#1A1D2E;color:#E5E7EB;font-size:14px;margin-bottom:8px}
body.light .search-box{border-color:rgba(0,0,0,0.15);background:#fff;color:#282828}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid #2A2D3E;background:#1A1D2E;color:#9CA3AF;white-space:nowrap;cursor:pointer}
body.light .chip{border-color:rgba(0,0,0,0.15);background:#f0f0f0;color:#666}
.chip.ativo{background:#C82828;border-color:#C82828;color:#fff}
.grupos{padding:0 16px;display:flex;flex-direction:column;gap:12px}
.grupo-card{background:#1A1D2E;border-radius:12px;overflow:hidden}
body.light .grupo-card{background:#fff;border:1px solid rgba(0,0,0,0.08)}
.grupo-card.tem-urgente{border:1px solid #EF4444}
.grupo-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.grupo-nome{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:#fff}
body.light .grupo-nome{color:#282828}
.grupo-icon{width:28px;height:28px;border-radius:7px;background:#1E3A5F;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
body.light .grupo-icon{background:#FBEAEA;color:#C82828}
.grupo-meta{display:flex;align-items:center;gap:6px}
.grupo-count{font-size:11px;background:#0F1117;color:#F09595;padding:2px 8px;border-radius:20px;font-weight:600}
body.light .grupo-count{background:#FBEAEA;color:#C82828}
.urg-dot{width:8px;height:8px;border-radius:50%;background:#EF4444}
.chevron{font-size:14px;color:#6B7280;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.grupo-itens{border-top:1px solid #2A2D3E}
body.light .grupo-itens{border-top-color:rgba(0,0,0,0.08)}
.sub-label{padding:6px 14px;font-size:10px;font-weight:600;color:#C82828;background:#0F1117;text-transform:uppercase;letter-spacing:.05em}
body.light .sub-label{background:#FBEAEA;color:#C82828}
.item{padding:12px 14px;border-bottom:1px solid #1E2130;position:relative}
body.light .item{border-bottom-color:rgba(0,0,0,0.06)}
.item:last-child{border-bottom:none}
.item.urgente{border-left:3px solid #EF4444}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.item-desc{font-size:13px;font-weight:500;color:#E5E7EB;line-height:1.4}
body.light .item-desc{color:#282828}
.item-pedido{font-size:11px;color:#6B7280;white-space:nowrap;font-weight:600}
.item-cliente{font-size:11px;color:#9CA3AF;margin-bottom:6px}
body.light .item-cliente{color:#666}
.item-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.tag-qty{background:#1E3A5F;color:#93C5FD}
body.light .tag-qty{background:#FBEAEA;color:#C82828}
.tag-hoje{background:#78350F;color:#FCD34D}
.tag-urg{background:#7F1D1D;color:#FCA5A5}
body.light .tag-hoje{background:#FEF3C7;color:#92400E}
body.light .tag-urg{background:#FCEBEB;color:#A32D2D}
.tag-sub{background:#1E3A2F;color:#6EE7B7;font-size:10px}
body.light .tag-sub{background:#D1FAE5;color:#065F46}
.item-selects{display:flex;flex-direction:column;gap:6px}
.sel{width:100%;padding:7px 10px;border-radius:8px;border:1px solid #2A2D3E;background:#0F1117;color:#E5E7EB;font-size:12px;cursor:pointer}
body.light .sel{border-color:rgba(0,0,0,0.15);background:#f5f5f0;color:#282828}
.sel.obs-ativo{border-color:#7C3ABE;background:#1E1433;color:#C084FC}
body.light .sel.obs-ativo{border-color:#7C3ABE;background:#F3E8FF;color:#6B21A8}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#1A1D2E;border-top:1px solid #2A2D3E;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
body.light .bottom-bar{background:#fff;border-top-color:rgba(0,0,0,0.1)}
.bottom-info{font-size:11px;color:#6B7280;display:flex;align-items:center;gap:6px}
.bottom-btn{padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid #2A2D3E;background:#C82828;color:#fff;display:flex;align-items:center;gap:5px}
.loading,.error{text-align:center;padding:4rem 2rem;color:#6B7280}
.loading i{font-size:40px;margin-bottom:1rem;display:block;animation:spin 1s linear infinite;color:#C82828}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

<script>
const firebaseConfig = {
  apiKey: "AIzaSyArW1ZFlBetezMPgIT5_cb5C5f5UmZYNco",
  authDomain: "pcp-dea.firebaseapp.com",
  databaseURL: "https://pcp-dea-default-rtdb.firebaseio.com",
  projectId: "pcp-dea",
  storageBucket: "pcp-dea.firebasestorage.app",
  messagingSenderId: "795369773538",
  appId: "1:795369773538:web:834b595f81cba21d8701bb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
var GH_REPO='lhtorres1995/pcp-sync';
var GH_FILE='dados.json';
var RAW_URL='https://raw.githubusercontent.com/'+GH_REPO+'/refs/heads/main/'+GH_FILE;
var ghSHA=null;
var DADOS=[];
var filtroMaq='';
var filtroSub='';
var autoInterval=null;

var GRUPOS_DEF=[
  {nome:'FLEXO 250',icon:'F1',subs:['FLEXO 1','FLEXO 2','FLEXO 3'],tipoTempo:'ml'},
  {nome:'FLEXO 350',icon:'F2',subs:['ETIRAMA','KROMIA','NACBRAS'],tipoTempo:'ml'},
  {nome:'TROQUELADORAS',icon:'TR',subs:['TROQUELADORA 1','TROQUELADORA 2','PULMÃO'],tipoTempo:'ml'},
  {nome:'TERMICA',icon:'TH',subs:[],tipoTempo:'ml'},
  {nome:'BATIDA',icon:'BA',subs:['CHINESA','TURO'],tipoTempo:'bat'},
  {nome:'CORTE BROTECH / VOREY',icon:'CB',subs:['BROTECH','VOREY'],tipoTempo:'ml'},
  {nome:'REVISORAS',icon:'RE',subs:[],tipoTempo:'ml'},
  {nome:'PRE-IMPRESSAO',icon:'PI',subs:[],display:'PRÉ-IMPRESSÃO',tipoTempo:'none'},
  {nome:'DIGITAL',icon:'DG',subs:[],tipoTempo:'ml'},
];
function limparMP(raw){
  if(!raw)return'';
  var IGNORAR=['RIBBON','LAMINAC','FILME DE LAM','CERA AWR','CERA TTO','FITA DE TRANSF','FITA TRANSFER'];
  var norm=function(s){return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');};
  var texto=raw.replace(/\r/g,'').replace(/\n/g,' ');
  var partes=texto.split(/(?:CSO\/)?(?=(?:PR|MP)\d{9,})/).map(function(s){return s.trim();}).filter(Boolean);
  var filtradas=partes.filter(function(s){return!IGNORAR.some(function(p){return norm(s).includes(p);});});
  var base=filtradas.length?filtradas[0]:(partes.length?partes[0]:raw);
  return base.replace(/^(?:PR|MP)\d+\s*[-–]\s*/,'').trim()||base;
}
function extrairFormato(desc){
  if(!desc)return'';
  var m=(desc||'').match(/(\d+(?:[,.]\d+)?(?:MM|M|CM)?)\s*[Xx×]\s*(\d+(?:[,.]\d+)?(?:MM|M|CM)?)/i);
  if(!m)return'';
  return m[1].toUpperCase().replace('MM','')+'×'+m[2].toUpperCase().replace('MM','');
}
function ordCompare(a,b){
  var oa=(a.ordem===undefined||a.ordem===null||a.ordem==='')?null:a.ordem;
  var ob=(b.ordem===undefined||b.ordem===null||b.ordem==='')?null:b.ordem;
  if(oa!==null&&ob!==null)return oa-ob;
  if(oa!==null&&ob===null)return -1;
  if(oa===null&&ob!==null)return 1;
  var da=parseDateBR(a.entrega),db=parseDateBR(b.entrega);
  return(da?da.getTime():9e12)-(db?db.getTime():9e12);
}
var VELOCIDADES={
  'FLEXO 1':1800,'FLEXO 2':1800,'FLEXO 3':1800,
  'ETIRAMA':2400,'NACBRAS':2400,'KROMIA':2400,
  'DIGITAL':1800,
  'CHINESA':3000,'TURO':3000,
  'TROQUELADORA 1':2000,'TROQUELADORA 2':2000,'PULMAO':2000,
  'BROTECH':2000,'VOREY':600,
  'REVISORAS':2400,
  'TERMICA':360
};
var DESPERDICIO={
  'FLEXO 350':90,'FLEXO 250':90,
  'CORTE BROTECH / VOREY':10,'DIGITAL':10,'TROQUELADORAS':10,'REVISORAS':10,
  'BATIDA':15,'TERMICA':5
};
var SETUP_FIXO={
  'FLEXO 350':90,'FLEXO 250':90,
  'CORTE BROTECH / VOREY':20,'DIGITAL':20,'TROQUELADORAS':20,'BATIDA':20,
  'REVISORAS':10,'TERMICA':10
};
function getSetupMin(r){return SETUP_FIXO[r.grupo]||0;}
function normChave(s){return(s||'').toString().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function getVelocidade(r){
  var chave=r.sub?normChave(r.sub):normChave(r.grupo);
  if(VELOCIDADES[chave]!==undefined)return VELOCIDADES[chave];
  var g=normChave(r.grupo);
  if(g==='FLEXO 350')return 2400;
  if(g==='FLEXO 250')return 1800;
  if(g==='TROQUELADORAS')return 2000;
  if(g==='CORTE BROTECH / VOREY')return 2000;
  if(g==='REVISORAS')return 2400;
  if(g==='DIGITAL')return 1800;
  if(g==='TERMICA')return 360;
  if(g==='BATIDA')return 3000;
  return null;
}
function getDesperdicio(r){return DESPERDICIO[r.grupo]||0;}
function metrosReais(r){
  // O campo 'metros' já é o M/L a produzir (do saldo), pronto para uso
  var m=parseNum(r.metros);
  return isNaN(m)?0:m;
}
function parseNum(v){
  if(v==null||v==='')return NaN;
  if(typeof v==='number')return v;
  var s=v.toString().trim();
  if(s.indexOf(',')>=0)return parseFloat(s.replace(/\./g,'').replace(',','.'));
  return parseFloat(s);
}
function calcTempo(r){
  var gInfo=GRUPOS_DEF.find(function(x){return x.nome===r.grupo;});
  if(!gInfo||gInfo.tipoTempo==='none')return null;
  var vel=getVelocidade(r);
  var setup=getSetupMin(r);
  var ml=metrosReais(r);
  var qtd=parseNum(r.qtd);
  if(!vel||vel<=0)return null;
  var setupH=(setup>0)?(setup/60):0;
  if(gInfo.tipoTempo==='bat'){
    var qtdB, unB;
    var un1=(r.un||'').toUpperCase().trim();
    var s2=parseNum(r.saldo2);
    if(un1==='ROLO'&&!isNaN(s2)&&s2>0){qtdB=s2;unB=(r.un2||'').toUpperCase().trim();}
    else{qtdB=qtd;unB=un1;}
    if(!qtdB||isNaN(qtdB))return null;
    if(unB.includes('M/')||unB==='MILHEIRO'||unB==='MIL'||unB==='MI')qtdB=qtdB*1000;
    var imagens=parseNum(r.imagens);
    if(!imagens||imagens<=0)imagens=1;
    return fmtTempo(((qtdB/imagens)/vel)+setupH);
  }
  if(!ml||isNaN(ml))return null;
  ml=ml+getDesperdicio(r);
  return fmtTempo((ml/vel)+setupH);
}
function fmtTempo(h){
  if(isNaN(h)||h<=0)return null;
  var hh=Math.floor(h),mm=Math.round((h-hh)*60);
  if(mm===60)return(hh+1)+'h 00min';
  return hh+'h '+(mm<10?'0':'')+mm+'min';
}
var OBS_OPCOES=['','Aguardando Faca','Aguardando Cliche','Aguardando Aprovacao','Aguardando MP'];

function getToken(){return localStorage.getItem('pcp_gh_token')||'';}
function setToken(t){localStorage.setItem('pcp_gh_token',t);}
function getAPI(){return'https://api.github.com/repos/'+GH_REPO+'/contents/'+GH_FILE;}
function getHeaders(){return{'Authorization':'token '+getToken(),'Accept':'application/vnd.github.v3+json'};}

function alternarTema(){
  var isLight=document.body.classList.toggle('light');
  localStorage.setItem('pcp_tema',isLight?'light':'dark');
  document.getElementById('btn-tema').innerHTML=isLight?'<i class="ti ti-moon"></i>':'<i class="ti ti-sun"></i>';
  document.querySelector('meta[name="theme-color"]').content=isLight?'#fff':'#0F1117';
}
function aplicarTema(){
  if(localStorage.getItem('pcp_tema')==='light'){
    document.body.classList.add('light');
    document.getElementById('btn-tema').innerHTML='<i class="ti ti-moon"></i>';
    document.querySelector('meta[name="theme-color"]').content='#fff';
  }
}
function trocarToken(){
  localStorage.removeItem('pcp_gh_token');
  var t=prompt('Cole seu GitHub Personal Access Token:');
  if(t&&t.trim())setToken(t.trim());
}

function parseDateBR(s){var m=(s||'').match(/(\d{2})\/(\d{2})\/(\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);return null;}
function diasPara(s){var d=parseDateBR(s);if(!d)return 999;var h=new Date();h.setHours(0,0,0,0);return Math.round((d-h)/864e5);}
function fmtQtd(v){if(v===null||v===undefined)return'';var n=parseFloat((v+'').replace(',','.'));return isNaN(n)?String(v):n%1===0?n.toLocaleString('pt-BR'):n.toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:4});}
function nl(s){return(s||'').toLowerCase();}
function setDot(state){['dot','dot2'].forEach(function(id){var el=document.getElementById(id);if(el)el.className='dot'+(state?' '+state:'');});}

var _fbListener=false;
function processarDadosMob(dados){
  DADOS=dados.filter(function(r){return !r.finalizado&&r.grupo!=='__FIN__';}).map(function(r){if(!r.grupo||r.grupo===''){r.grupo='(AGUARDANDO MÁQUINA)';}return r;});
  setDot('');
  var atualizado=DADOS.length&&DADOS[0].atualizado?DADOS[0].atualizado:'';
  document.getElementById('update-txt').textContent=atualizado?'Ao vivo':'Ao vivo';
  if(!window._maqRestaurada){window._maqRestaurada=true;restaurarMaqMob();}
  renderChips();
  renderGrupos();
}
function carregar(manual){
  setDot('off');
  document.getElementById('update-txt').textContent='Conectando...';
  if(_fbListener){db.ref('itens').once('value').then(function(s){processarDadosMob(Object.values(s.val()||{}));});return;}
  _fbListener=true;
  db.ref('itens').on('value',function(snap){
    processarDadosMob(Object.values(snap.val()||{}));
  },function(err){
    setDot('off');
    document.getElementById('update-txt').textContent='Erro: '+err.message;
    document.getElementById('grupos').innerHTML='<div class="error"><i class="ti ti-wifi-off" style="font-size:40px;display:block;margin-bottom:1rem"></i>Erro ao conectar ao Firebase</div>';
  });
}

// ── Escrita por item no Firebase ──
function getEstacao(){
  try{var m=JSON.parse(localStorage.getItem('pcp_minha_maquina')||'{}');return m.grupo||'';}catch(e){return '';}
}
function salvarItem(id,campos){
  campos.atualizado=new Date().toLocaleString('pt-BR');
  var est=getEstacao();if(est)campos.operador=est;
  setDot('saving');
  db.ref('itens/'+id).update(campos).then(function(){setDot('');}).catch(function(e){setDot('off');console.error(e);});
}
function onChangeGrupo(id,val){
  var r=DADOS.find(function(x){return x.id===id;});if(!r)return;
  var campos={};
  if(val==='__FIN__'){campos.finalizado=true;campos.grupo='__FIN__';}
  else{
    if(r.grupo&&r.grupo!==val&&r.grupo!=='(AGUARDANDO MÁQUINA)')campos.ultimaMaquina=r.grupo;
    campos.finalizado=false;campos.grupo=val;campos.sub='';
  }
  salvarItem(id,campos);
}
function onChangeSub(id,val){salvarItem(id,{sub:val});}
function onChangeObs(id,val){salvarItem(id,{obs:val});}
function onChangeImagens(id,val){var n=parseFloat((val||'').toString().replace(',','.'));salvarItem(id,{imagens:(n&&n>0)?n:''});}

function renderChips(){
  var container=document.getElementById('chips-maquina');
  var maquinas=[];
  DADOS.forEach(function(r){if(r.grupo&&maquinas.indexOf(r.grupo)===-1)maquinas.push(r.grupo);});
  maquinas.sort();
  var html='<span class="chip'+(filtroMaq===''?' ativo':'')+'" onclick="setFiltro(\'\')">Todas</span>';
  maquinas.forEach(function(m){html+='<span class="chip'+(filtroMaq===m?' ativo':'')+'" onclick="setFiltro(\''+m+'\')">'+m+'</span>';});
  container.innerHTML=html;
  // Submáquinas do grupo selecionado
  var subC=document.getElementById('chips-sub');
  var gInfo=GRUPOS_DEF.find(function(x){return x.nome===filtroMaq;});
  if(filtroMaq&&gInfo&&gInfo.subs&&gInfo.subs.length){
    var sh='<span class="chip'+(filtroSub===''?' ativo':'')+'" onclick="setFiltroSub(\'\')">Toda</span>';
    gInfo.subs.forEach(function(s){sh+='<span class="chip'+(filtroSub===s?' ativo':'')+'" onclick="setFiltroSub(\''+s+'\')">'+s+'</span>';});
    sh+='<span class="chip" style="background:#C82828;color:#fff" onclick="fixarMaqMob()">📌 Fixar</span>';
    subC.innerHTML=sh;subC.style.display='flex';
  }else{
    subC.style.display='none';subC.innerHTML='';
  }
}
function setFiltro(m){filtroMaq=m;filtroSub='';renderChips();renderGrupos();}
function setFiltroSub(s){filtroSub=s;renderChips();renderGrupos();}
function fixarMaqMob(){
  try{localStorage.setItem('pcp_minha_maquina',JSON.stringify({grupo:filtroMaq,sub:filtroSub}));}catch(e){}
  alert('Maquina fixada! Sera aplicada automaticamente ao abrir.');
}
function restaurarMaqMob(){
  try{
    var raw=localStorage.getItem('pcp_minha_maquina');if(!raw)return;
    var m=JSON.parse(raw);
    if(m.grupo){filtroMaq=m.grupo;filtroSub=m.sub||'';}
  }catch(e){}
}

function renderGrupos(){
  var busca=nl(document.getElementById('busca').value);
  var dados=DADOS.filter(function(r){
    if(filtroMaq&&r.grupo!==filtroMaq)return false;
    if(filtroSub&&r.sub!==filtroSub)return false;
    if(busca&&!nl(r.cliente).includes(busca)&&!nl(r.produto).includes(busca)&&!nl(r.pedido).includes(busca)&&!nl(r.descricao).includes(busca))return false;
    return true;
  });
  document.getElementById('st-total').textContent=dados.length;
  document.getElementById('st-urg').textContent=dados.filter(function(r){return diasPara(r.entrega)<=2;}).length;
  var maqSet={};dados.forEach(function(r){if(r.grupo)maqSet[r.grupo]=1;});
  document.getElementById('st-maq').textContent=Object.keys(maqSet).length;
  document.getElementById('st-obs').textContent=DADOS.filter(function(r){return r.obs;}).length;
  var grupos={};
  dados.forEach(function(r){var g=r.grupo||'SEM';if(!grupos[g])grupos[g]=[];grupos[g].push(r);});
  var ordemGrupos=GRUPOS_DEF.map(function(g){return g.nome;});
  var chaves=Object.keys(grupos).sort(function(a,b){var ia=ordemGrupos.indexOf(a),ib=ordemGrupos.indexOf(b);if(ia===-1&&ib===-1)return a.localeCompare(b);if(ia===-1)return 1;if(ib===-1)return-1;return ia-ib;});
  var container=document.getElementById('grupos');
  container.innerHTML='';
  if(!chaves.length){container.innerHTML='<div class="loading" style="animation:none"><i class="ti ti-inbox" style="animation:none;color:#6B7280;font-size:40px;display:block;margin-bottom:1rem"></i>Nenhum pedido encontrado.</div>';return;}
  chaves.forEach(function(g){
    var itens=grupos[g].sort(ordCompare);
    var temUrg=itens.some(function(r){return diasPara(r.entrega)<=2;});
    var gInfo=GRUPOS_DEF.find(function(x){return x.nome===g;});
    var subs=gInfo&&gInfo.subs.length?gInfo.subs:null;
    var urgCount=itens.filter(function(r){return diasPara(r.entrega)<=2;}).length;
    var icon=gInfo?gInfo.icon:'??';
    var card=document.createElement('div');
    card.className='grupo-card'+(temUrg?' tem-urgente':'');
    var headerDiv=document.createElement('div');
    headerDiv.className='grupo-header';
    headerDiv.innerHTML='<div class="grupo-nome"><div class="grupo-icon">'+icon+'</div>'+g+'</div><div class="grupo-meta">'+(urgCount>0?'<span class="urg-dot"></span>':'')+'<span class="grupo-count">'+itens.length+'</span><i class="ti ti-chevron-down chevron open" id="chev-'+g.replace(/[^a-z0-9]/gi,'_')+'"></i></div>';
    headerDiv.onclick=function(){
      var body=card.querySelector('.grupo-itens');
      var chev=card.querySelector('.chevron');
      if(body.style.display==='none'){body.style.display='block';chev.classList.add('open');}
      else{body.style.display='none';chev.classList.remove('open');}
    };
    card.appendChild(headerDiv);
    var itensDiv=document.createElement('div');
    itensDiv.className='grupo-itens';
    if(subs){
      subs.forEach(function(sub){
        var si=itens.filter(function(r){return r.sub===sub;});
        if(!si.length)return;
        var sl=document.createElement('div');sl.className='sub-label';sl.textContent=sub+' ('+si.length+')';itensDiv.appendChild(sl);
        si.forEach(function(r){itensDiv.appendChild(criarItem(r,g,subs));});
      });
      var sem=itens.filter(function(r){return !r.sub;});
      if(sem.length){var sl2=document.createElement('div');sl2.className='sub-label';sl2.textContent='Sem submaquina ('+sem.length+')';itensDiv.appendChild(sl2);sem.forEach(function(r){itensDiv.appendChild(criarItem(r,g,subs));});}
    }else{itens.forEach(function(r){itensDiv.appendChild(criarItem(r,g,null));});}
    card.appendChild(itensDiv);
    container.appendChild(card);
  });
}

function criarItem(r,g,subs){
  var dias=diasPara(r.entrega);
  var div=document.createElement('div');
  div.className='item'+(dias<=2?' urgente':'');
  var dataTag='';
  if(dias<=0)dataTag='<span class="tag tag-hoje">HOJE</span>';
  else if(dias===1)dataTag='<span class="tag tag-urg">AMANHA</span>';
  else if(dias===2)dataTag='<span class="tag tag-urg">2d</span>';
  var opG=GRUPOS_DEF.map(function(x){return'<option value="'+x.nome+'" '+(r.grupo===x.nome?'selected':'')+'>'+(x.display||x.nome)+'</option>';}).join('');
  opG+='<option value="__FIN__"> Finalizado</option>';
  var subSel='';
  if(subs){var opS=subs.map(function(s){return'<option value="'+s+'" '+(r.sub===s?'selected':'')+'>'+s+'</option>';}).join('');subSel='<select class="sel" onchange="onChangeSub(\''+r.id+'\',this.value)"><option value="">- submaquina -</option>'+opS+'</select>';}
  var opObs=OBS_OPCOES.map(function(o){return'<option value="'+o+'" '+(r.obs===o?'selected':'')+'>'+( o||'- sem observacao -')+'</option>';}).join('');
  var obsClass=r.obs?'obs-ativo':'';
  var tempo=calcTempo(r);
  var tempoTag=tempo?'<span class="tag" style="background:#FBEAEA;color:#C82828">'+tempo+'</span>':'';
  var mlReal=metrosReais(r);var mlTag=mlReal>0?'<span class="tag tag-sub">'+fmtQtd(mlReal)+' m/l</span>':'';
  var largTag=r.largMP?'<span class="tag tag-sub">'+r.largMP+'mm</span>':'';
  var mpShortMob=limparMP(r.mp);
  var formatoMob=extrairFormato(r.descricao);
  var mpTagMob=mpShortMob?'<span class="tag tag-sub" title="'+(r.mp||'')+'">'+mpShortMob+'</span>':'';
  var formatoTagMob=formatoMob?'<span class="tag" style="background:#F0F0E8;color:#555;font-family:monospace;font-weight:600">'+formatoMob+'</span>':'';
  var imagensField=(r.grupo==='BATIDA')?'<div style="display:flex;align-items:center;gap:6px"><label style="font-size:12px;color:var(--text2,#666)">Imagens da faca:</label><input type="number" min="1" step="1" value="'+(r.imagens||'')+'" placeholder="1" onchange="onChangeImagens(\''+r.id+'\',this.value)" style="width:60px;padding:4px;font-size:13px;border:1px solid var(--border,#ccc);border-radius:6px;text-align:center;background:transparent;color:inherit"></div>':'';
  div.innerHTML='<div class="item-top"><div class="item-desc">'+(r.descricao||'')+'</div><div class="item-pedido">'+(r.pedido||'')+'/'+( r.item||'')+'</div></div><div class="item-cliente">'+(r.cliente||'')+'</div><div class="item-tags"><span class="tag tag-qty">'+fmtQtd(r.qtd)+' '+(r.un||'')+'</span>'+formatoTagMob+mlTag+largTag+mpTagMob+tempoTag+dataTag+(r.sub?'<span class="tag tag-sub">'+(r.sub||'')+'</span>':'')+'</div><div class="item-selects"><select class="sel" onchange="onChangeGrupo(\''+r.id+'\',this.value)"><option value="">- selecionar maquina -</option>'+opG+'</select>'+subSel+'<select class="sel '+obsClass+'" onchange="onChangeObs(\''+r.id+'\',this.value)">'+opObs+'</select>'+imagensField+'</div>';
  return div;
}

aplicarTema();
carregar(true);
</script>
